<script>
    const div= document.createElement('div')//yoo display hudaina memory ma matra dekhauxa
    console.log(div);
    div.className="main"
    div.id= Math.round(Math.random() *10+1)

    div.style.padding="14px"
    div.innerText="hulululu"

    const addText=document.createTextNode("hulululu")
    div.appendChild(addText)

    document.body.appendChild(div)
